name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_api:
        description: Run read-only public API smoke tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --locked
      - name: Check all tracked files
        # Gitleaks scans staged changes locally. GitHub secret scanning and push
        # protection cover remote commits; an empty CI index cannot do that.
        env:
          SKIP: gitleaks
        run: uv run --no-sync pre-commit run --all-files
      - name: Run offline tests
        run: uv run --no-sync pytest -q
      - name: Build distributions
        run: uv build --force-pep517
      - name: Verify installed wheel outside the source checkout
        working-directory: ${{ runner.temp }}
        env:
          WHEEL_DIR: ${{ github.workspace }}/dist
        run: |
          uv run --isolated --no-project --python 3.13 --exclude-newer '7 days' --with "$WHEEL_DIR"/*.whl python -c 'from opencaselaw import OpenCaseLawClient, OpenCaseLawAPIError; from importlib.resources import files; assert files("opencaselaw").joinpath("py.typed").is_file()'

  compatibility:
    name: Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q

  live-api:
    if: github.event_name == 'workflow_dispatch' && inputs.live_api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest --live-api tests/opencaselaw/test_live_api.py
