[project]
name = "opencaselaw-client"
version = "0.1.0"
description = "Independent Python client for the public OpenCaseLaw API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Arnecke" }]
requires-python = ">=3.12"
keywords = ["switzerland", "legal", "api", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/rnckp/opencaselaw-client"
Repository = "https://github.com/rnckp/opencaselaw-client"
Issues = "https://github.com/rnckp/opencaselaw-client/issues"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "ruff>=0.14.13",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
# eMudhra/emSign security fix; retain while the cutoff excludes the patched release.
exclude-newer-package = { certifi = false }
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["live_api: opt-in read-only requests to the public API"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.16,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opencaselaw"
