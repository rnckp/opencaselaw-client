[project]
name = "opencaselaw-client"
version = "0.1.0"
description = "Independent Python client for the public OpenCaseLaw API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opencaselaw*"]
